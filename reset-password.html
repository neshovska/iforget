<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>iForget — нова парола</title>
<style>
  /* Самостоятелна страница за смяна на парола, отворена от линка в имейла
     "Забравена парола?" (виж handleForgotPassword() в index.html). Firebase
     праща линк с ?mode=resetPassword&oobCode=... — тази страница обработва
     кода директно тук, на нашия домейн, вместо на firebaseapp.com (виж
     "Customize action URL" в Firebase Console → Authentication →
     Templates → Password reset). Палитрата е копие на тъмната тема на
     основното приложение, за визуална консистентност. */
  :root{
    --bg:#141B2E; --card:#1D2941; --card-2:#26344F; --border:#38496B;
    --text:#F0F3F9; --text-dim:#98A3B9; --accent:#5B96FF; --accent-dim:#3D71C4;
    --green:#5AB77C; --danger:#E36358;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;height:100%;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:340px;width:100%;text-align:center;}
  h1{font-size:26px;font-weight:800;color:var(--accent);margin:0 0 8px;letter-spacing:.3px;}
  p{font-size:14px;color:var(--text-dim);line-height:1.55;margin:0 0 22px;}
  p strong{color:var(--text);}
  .auth-input{
    -webkit-appearance:none;appearance:none;width:100%;background:var(--card);
    border:1px solid var(--border);color:var(--text);border-radius:12px;
    padding:12px 14px;font-size:15px;outline:none;font-family:inherit;
    box-sizing:border-box;margin-bottom:10px;
  }
  .auth-input:focus{border-color:var(--accent-dim);}
  .submit-btn{
    -webkit-appearance:none;appearance:none;width:100%;background:var(--accent);
    color:var(--bg);border:none;border-radius:12px;padding:12px;font-size:14.5px;
    font-weight:700;font-family:inherit;line-height:1;
  }
  .submit-btn:active{opacity:.85;}
  .form-error{font-size:12.5px;color:var(--danger);line-height:1.4;margin:0 0 10px;display:none;text-align:left;}
  .success-text{color:var(--green);font-size:15px;font-weight:700;margin:0 0 22px;}
  .back-link{
    display:inline-block;margin-top:22px;color:var(--accent-dim);font-size:13px;
    font-weight:600;text-decoration:none;
  }
  .loading-text{color:var(--text-dim);font-size:14px;}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>iForget</h1>
  <div class="loading-text" id="loadingText">Проверявам линка...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOFzRfhPe2tZl96S1KspEfGwNlr732q5U",
  authDomain: "iforgetbg.firebaseapp.com",
  projectId: "iforgetbg",
  storageBucket: "iforgetbg.firebasestorage.app",
  messagingSenderId: "782609746488",
  appId: "1:782609746488:web:28e5198ff82018732df4cd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const params = new URLSearchParams(window.location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');
const card = document.getElementById('card');

function renderError(msg){
  card.innerHTML = `
    <h1>iForget</h1>
    <p style="color:var(--danger)">${msg}</p>
    <a class="back-link" href="/">← Обратно към iForget</a>`;
}

function renderForm(email){
  card.innerHTML = `
    <h1>iForget</h1>
    <p>Нова парола за <strong>${email}</strong></p>
    <div class="form-error" id="formError"></div>
    <input type="password" id="pw1" class="auth-input" placeholder="Нова парола" minlength="6" autocomplete="new-password">
    <input type="password" id="pw2" class="auth-input" placeholder="Потвърди парола" minlength="6" autocomplete="new-password">
    <button type="button" class="submit-btn" id="submitBtn">Смени паролата</button>`;

  document.getElementById('submitBtn').addEventListener('click', ()=>{
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const errEl = document.getElementById('formError');
    errEl.style.display = 'none';
    if(pw1.length < 6){
      errEl.textContent = 'Паролата трябва да е поне 6 символа.';
      errEl.style.display = 'block';
      return;
    }
    if(pw1 !== pw2){
      errEl.textContent = 'Паролите не съвпадат.';
      errEl.style.display = 'block';
      return;
    }
    auth.confirmPasswordReset(oobCode, pw1).then(()=>{
      card.innerHTML = `
        <h1>iForget</h1>
        <div class="success-text">Паролата е сменена успешно!</div>
        <a class="back-link" href="/">Вход в iForget →</a>`;
    }).catch(err=>{
      console.error('confirmPasswordReset failed', err);
      errEl.textContent = 'Нещо се обърка — линкът може да е изтекъл. Поискай нов от екрана за вход.';
      errEl.style.display = 'block';
    });
  });
}

if(mode !== 'resetPassword' || !oobCode){
  renderError('Линкът е невалиден.');
}else{
  auth.verifyPasswordResetCode(oobCode).then(renderForm).catch(err=>{
    console.error('verifyPasswordResetCode failed', err);
    renderError('Линкът е изтекъл или вече е използван. Поискай нов от екрана за вход.');
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IForget">
<meta name="theme-color" content="#141B2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>IForget</title>
<style>
  /* Тъмната тема е с 1-2 тона по-светла от първоначалната — фонът/картите/
     рамките са вдигнати към по-светъл нюанс на тъмно-синьото, за да не е
     толкова черно, докато акцентният син е леко изсветлен за баланс. */
  :root{
    --bg:#141B2E;
    --card:#1D2941;
    --card-2:#26344F;
    --border:#38496B;
    --text:#F0F3F9;
    --text-dim:#98A3B9;
    --gold:#DFAE3A;
    --gold-dim:#A6841F;
    --accent:#5B96FF;
    --accent-dim:#3D71C4;
    --green:#5AB77C;
    --danger:#E36358;
    --topbar-h:56px;
    /* Цветове на категориите/таговете на бележките — умишлено различни от
       gold/green/danger (заети от статусите), за да не се бъркат визуално. */
    --tag-personal:#FF4FA3;
    --tag-personal-bg:rgba(255,79,163,.16);
    --tag-work:#4FAE9E;
    --tag-work-bg:rgba(79,174,158,.16);
    --tag-custom:#A855F7;
    --tag-custom-bg:rgba(168,85,247,.16);
  }
  /* Светла тема — палитра "Капучино": топъл млечно-бежов фон, пяна и
     карамел вместо лилаво/синьо, за да пасне на цялостния кафяв нюанс, а не
     да стърчи студен акцент върху топла основа; превключва се с бутона до
     търсачката и се пази в localStorage. */
  :root[data-theme="light"]{
    --bg:#F1E4D2;
    --card:#FBF6EC;
    --card-2:#E8D5B7;
    --border:#D6BE97;
    --text:#3B2A1C;
    --text-dim:#8C7357;
    --gold:#C77D0A;
    --gold-dim:#9C6208;
    --accent:#8C5A2B;
    --accent-dim:#6E4620;
    --green:#5E8F52;
    --danger:#C0503C;
    --tag-personal:#D6217A;
    --tag-personal-bg:rgba(214,33,122,.15);
    --tag-work:#0E8F79;
    --tag-work-bg:rgba(14,143,121,.15);
    --tag-custom:#7C3AED;
    --tag-custom-bg:rgba(124,58,237,.15);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
    -webkit-font-smoothing:antialiased;height:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;transition:background-color .15s ease,color .15s ease;}

  /* Фонов десен от гинко листенца — реални изображения (доставени от
     потребителя), едно на цвят/тема: bg-dark.jpg (тъмно+златни контури) за
     тъмната тема, bg-light.jpg (кремаво+бежови контури) за светлата.
     Сложени директно като background-image на body — гарантирано най-
     долният слой, скролва с цялото съдържание, тайлва се безшевно и
     хоризонтално, и вертикално за произволно дълъг списък с бележки. */
  body{
    background-image:url("bg-dark.jpg");
    background-repeat:repeat;
    background-size:380px 821px;
  }
  :root[data-theme="light"] body{
    background-image:url("bg-light.jpg");
  }

  /* Всички икони в приложението са монохромни inline SVG (stroke=currentColor)
     вместо емоджита — така никога не изкарват цветни глифове и винаги пасват
     на текущата тема. */
  svg.ic{display:block;flex-shrink:0;}

  .topbar{
    position:sticky;top:0;z-index:20;flex-shrink:0;
    background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{
    font-size:16px;font-weight:700;letter-spacing:.3px;color:var(--accent);
    margin:0;
  }
  /* Бутоните за език/тема/търсене са ясно видими "чипове" с фон и рамка,
     не просто тих текст — за да се забелязват веднага в топбара. */
  .topbar-actions{display:flex;align-items:center;gap:6px;}
  .icon-btn{
    background:var(--card-2);border:1px solid var(--border);color:var(--text-dim);
    font-size:14px;padding:6px 9px;line-height:1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{opacity:.7;}
  #langBtn{font-size:12px;font-weight:700;letter-spacing:.3px;min-width:28px;}
  /* Общо за search/категории бутоните, когато редът им е отворен. */
  .icon-btn.active{color:var(--accent);border-color:var(--accent-dim);background:rgba(91,150,255,.12);}
  .search-row{display:none;gap:8px;margin-top:10px;}
  .search-row.open{display:flex;}
  .search-row input{
    flex:1;background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:9px 12px;font-size:14px;outline:none;
  }
  .search-row input:focus{border-color:var(--accent-dim);}
  .search-row button{
    background:none;border:none;color:var(--text-dim);padding:4px 8px;
    display:flex;align-items:center;justify-content:center;
  }
  /* Ред с категории — чипове за филтриране по таг, отваря се от иконата
     до търсенето, подобно на search-row. */
  .cat-row{display:none;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .cat-row.open{display:flex;}
  .cat-chip{
    border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600;
    background:var(--card-2);color:var(--text-dim);display:flex;align-items:center;gap:5px;
  }
  .cat-chip .n{background:var(--bg);border-radius:8px;padding:0 5px;font-size:10.5px;}
  .cat-chip.active{border-color:var(--accent);color:var(--accent);}
  .cat-chip.active .n{color:var(--accent);}

  /* Тагче на бележка (Лични/Работни/произволно) — тапва се за смяна.
     Отделно от .tag (статус-етикета "в прогрес"/"завършено"). Ресетваме
     -webkit-appearance и line-height, иначе браузърът добавя невидим
     допълнителен размер на <button> елементите и тагчето изглежда огромно. */
  .tag-pill{
    -webkit-appearance:none;appearance:none;
    display:inline-flex;align-items:center;font-size:9px;font-weight:600;line-height:1.4;
    padding:1px 6px;border-radius:6px;border:none;font-family:inherit;
  }
  .tag-pill.personal{background:var(--tag-personal-bg);color:var(--tag-personal);}
  .tag-pill.work{background:var(--tag-work-bg);color:var(--tag-work);}
  .tag-pill.custom{background:var(--tag-custom-bg);color:var(--tag-custom);}
  /* "+ таг" (все още неотбелязана бележка) — само гол текст, никакво
     ограждане (нито фон, нито рамка), за разлика от избраните категории. */
  .tag-pill.empty{background:none;color:var(--text-dim);border:none;padding:1px 2px;}

  /* Плаващ picker за смяна на тага — позициониран динамично под тапнатото
     тагче (виж openTagPicker()). */
  .tag-picker{
    display:none;position:fixed;z-index:25;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);min-width:160px;
  }
  .tag-picker.show{display:block;}
  .tag-picker button{
    width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:13px;font-weight:600;
    padding:7px 8px;border-radius:8px;display:flex;align-items:center;gap:7px;font-family:inherit;
  }
  .tag-picker .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tag-picker hr{border:none;border-top:1px solid var(--border);margin:4px 0;}
  /* Ред с полето за нов таг + бутон за потвърждение (тикче) до него — както
     всички останали "запази" бутони в приложението (edit-save, sub-save),
     вместо да разчитаме само на Enter. */
  .tag-newrow{display:flex;gap:6px;align-items:center;margin-top:4px;}
  .tag-newrow input{
    flex:1;width:auto;background:var(--card-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px 8px;font-size:12.5px;outline:none;font-family:inherit;box-sizing:border-box;
  }
  .tag-newrow .tag-confirm{
    width:26px;height:26px;flex-shrink:0;border-radius:8px;border:none;padding:0;
    background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;
  }

  /* Панел "Настройки" — резервно копие (Export/Import), защото localStorage
     НЕ е гарантирано трайно съхранение: Safari на iOS може да го изчисти
     (особено при икона на началния екран, дълго неотваряне на приложението
     или ниско свободно място) — виж requestPersistentStorage() и
     exportNotes()/importNotesFromFile(). Позициониран динамично под бутона,
     по същия начин като .tag-picker. */
  .settings-panel{
    display:none;position:fixed;z-index:25;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:240px;
  }
  .settings-panel.show{display:block;}
  .settings-panel button.action{
    width:100%;text-align:left;background:none;border:none;color:var(--text);font-size:13px;font-weight:600;
    padding:8px;border-radius:8px;display:flex;align-items:center;gap:8px;font-family:inherit;
  }
  .settings-panel button.action:active{background:var(--card-2);}
  .settings-panel hr{border:none;border-top:1px solid var(--border);margin:4px 0;}
  .settings-panel .hint{
    font-size:11px;line-height:1.45;color:var(--text-dim);padding:6px 8px 2px;
  }

  /* Екран за вход — покрива цялото приложение (position:fixed inset:0, най-
     високият z-index в страницата), докато Firebase Auth не потвърди активна
     сесия. Бележките вече живеят в Firestore, разделени по потребител
     (users/{uid}), затова без вход няма какво да се покаже. */
  .auth-screen{
    display:none;position:fixed;inset:0;z-index:50;background:var(--bg);
    flex-direction:column;align-items:center;justify-content:center;padding:24px;
    text-align:center;
  }
  .auth-screen.show{display:flex;}
  .auth-card{max-width:320px;width:100%;}
  .auth-card h1{font-size:28px;font-weight:800;color:var(--accent);margin:0 0 8px;letter-spacing:.3px;}
  .auth-card p{font-size:14px;color:var(--text-dim);line-height:1.55;margin:0 0 24px;}
  /* Форма за вход/регистрация с имейл + парола — алтернатива на Google,
     за да не се минава задължително през Google-екрана (виж setAuthMode()/
     handleEmailAuthSubmit() в скрипта). */
  .email-auth-form{display:flex;flex-direction:column;gap:10px;text-align:left;}
  .auth-input{
    -webkit-appearance:none;appearance:none;
    width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:15px;outline:none;font-family:inherit;box-sizing:border-box;
  }
  .auth-input:focus{border-color:var(--accent-dim);}
  .auth-form-error{font-size:12.5px;color:var(--danger);line-height:1.4;}
  .auth-submit-btn{
    -webkit-appearance:none;appearance:none;
    width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:12px;
    padding:12px;font-size:14.5px;font-weight:700;font-family:inherit;line-height:1;
  }
  .auth-submit-btn:active{opacity:.85;}
  .link-btn{
    -webkit-appearance:none;appearance:none;
    background:none;border:none;color:var(--accent-dim);font-size:13px;font-weight:600;
    font-family:inherit;padding:4px;line-height:1.3;
  }
  .auth-toggle-mode{font-size:13px;color:var(--text-dim);margin-top:12px;}
  .auth-loading{font-size:13px;color:var(--text-dim);margin-top:18px;}

  /* Кръгло "профилче" в топбара — инициал на имейла (цветът му е избираем,
     виж .color-sw по-долу), тапва се за отваряне на .profile-panel. */
  .user-chip{
    -webkit-appearance:none;appearance:none;
    width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;padding:0;
    border:1px solid var(--border);background:var(--card-2);display:flex;
    align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;font-weight:700;
    font-family:inherit;
  }
  .user-chip img{width:100%;height:100%;object-fit:cover;display:block;}
  .user-chip:active{opacity:.7;}

  /* Панел "Профил" — смяна на цвета на буквата в профилчето, смяна на
     парола/имейл (виж renderProfileMenu()/renderPasswordForm()/
     renderEmailForm() в скрипта) и изход. Компактен, аналогичен на
     .settings-panel/.tag-picker — закачен под userChip. */
  .profile-panel{
    display:none;position:fixed;z-index:25;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:230px;
  }
  .profile-panel.show{display:block;}
  .profile-panel .profile-email{
    font-size:11.5px;color:var(--text-dim);word-break:break-all;margin:0 0 10px;padding:0 2px;
  }
  .profile-panel .color-row{display:flex;gap:7px;margin:0 0 10px;padding:0 2px;flex-wrap:wrap;}
  .profile-panel .color-sw{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;flex-shrink:0;
  }
  .profile-panel .color-sw.active{border-color:var(--text);}
  .profile-panel hr{border:none;border-top:1px solid var(--border);margin:6px 0;}
  .profile-panel button.action{
    -webkit-appearance:none;appearance:none;width:100%;text-align:left;background:none;border:none;
    color:var(--text);font-size:13px;font-weight:600;padding:8px;border-radius:8px;
    display:flex;align-items:center;gap:8px;font-family:inherit;
  }
  .profile-panel button.action:active{background:var(--card-2);}
  .profile-panel button.action.danger{color:var(--danger);}
  .profile-panel .sub-form{display:flex;flex-direction:column;gap:8px;padding:2px;}
  .profile-panel .sub-form input{
    -webkit-appearance:none;appearance:none;width:100%;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;
    font-family:inherit;box-sizing:border-box;
  }
  .profile-panel .form-msg{font-size:11.5px;line-height:1.4;display:none;}
  .profile-panel .form-msg.error{color:var(--danger);display:block;}
  .profile-panel .form-msg.success{color:var(--green);display:block;}
  .profile-panel .sub-form-actions{display:flex;gap:8px;}
  .profile-panel .sub-form-actions button{
    -webkit-appearance:none;appearance:none;flex:1;border-radius:8px;padding:8px;
    font-size:12.5px;font-weight:700;font-family:inherit;border:none;
  }
  .profile-panel .sub-form-actions button.secondary{
    background:var(--card-2);color:var(--text-dim);border:1px solid var(--border);font-weight:600;
  }
  .profile-panel .sub-form-actions button.primary{background:var(--accent);color:var(--bg);}

  /* Активната зона запълва останалото пространство и подрежда съдържанието
     си долу (justify-content:flex-end) — така при малко бележки те стоят
     залепени до полето за писане, а не окачени горе с празно място под тях.
     Когато бележките станат повече от наличното място, изтласкват се нагоре
     естествено, както в чат приложение. */
  main{
    padding:6px 20px 0;padding-bottom:112px;
    flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;
  }

  /* Заглавие на статус-секция — стои над всички дневни блокове с дадения
     статус, за да личи ясно разделението Приключени / В прогрес / Активни,
     отделно от групирането по дата вътре във всяка секция. */
  .status-section{
    display:flex;align-items:center;gap:8px;margin:22px 4px 2px;
    font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--text-dim);
  }
  .status-section:first-child{margin-top:4px;}
  .status-section-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
  .status-section.done{color:var(--green);}
  .status-section.done .status-section-dot{background:var(--green);}
  .status-section.progress{color:var(--gold);}
  .status-section.progress .status-section-dot{background:var(--gold);}
  .status-section.active{color:var(--accent);}
  .status-section.active .status-section-dot{background:var(--accent);}
  .status-section-count{
    background:var(--card-2);color:inherit;border-radius:8px;
    padding:1px 7px;font-size:11px;font-weight:600;
  }

  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    transition:transform .12s ease-out;
    background:linear-gradient(0deg,var(--bg) 82%,transparent);
    padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .input-row{display:flex;gap:8px;align-items:center;}
  #noteInput{
    flex:1;background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:14px;padding:12px 14px;font-size:16px;
    outline:none;
  }
  #noteInput:focus{border-color:var(--accent-dim);}
  /* Бутон за отказ на новата бележка — появява се само докато има написан
     текст, изчиства полето и прибира клавиатурата, без да добавя бележка. */
  #noteCancelBtn{
    display:none;width:36px;height:44px;border:none;background:none;
    color:var(--text-dim);flex-shrink:0;align-items:center;justify-content:center;
  }
  #noteCancelBtn.show{display:flex;}
  #addBtn{
    width:44px;height:44px;border-radius:14px;border:none;
    background:var(--accent);color:var(--bg);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #addBtn:active{transform:scale(.94);}

  /* Заглавието на деня е "залепено" точно под topbar-а, докато скролваш —
     така винаги се вижда в коя дата от хронологията се намираш. */
  .day-block{margin-top:14px;}
  .day-label{
    position:sticky;top:var(--topbar-h);z-index:5;background:var(--bg);
    font-size:12px;font-weight:600;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px 4px;
    padding:4px 0;
    display:flex;align-items:center;gap:8px;
  }
  .day-label .count{
    background:var(--card-2);color:var(--accent);border-radius:8px;
    padding:1px 7px;font-size:11px;font-weight:600;
  }

  .note-wrap{margin-bottom:6px;}
  /* .note е колона от два реда: .note-top (дата/час, прилепени горе вдясно
     в карето) + .note-main (точка/текст/бутони — старият ред). Разделени
     умишлено, за да не се бори датата за пространство с бутоните за
     редакция/изтриване, които също стоят вдясно. */
  .note{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:8px 10px;display:flex;flex-direction:column;gap:2px;
  }
  .note-top{display:flex;justify-content:flex-end;}
  .note-main{display:flex;align-items:flex-start;gap:8px;}
  .note .dot{
    width:17px;height:17px;border-radius:50%;flex-shrink:0;margin-top:2px;
    border:1.5px solid var(--text-dim);display:flex;align-items:center;justify-content:center;
  }
  .note.progress .dot{border-color:var(--gold);background:rgba(201,162,39,.15);}
  .note.done .dot{border-color:var(--green);background:var(--green);color:#0E1A10;}
  .note .body{flex:1;min-width:0;}
  .note .txt{font-size:14px;line-height:1.35;word-break:break-word;}
  .note.done .txt{color:var(--text-dim);text-decoration:line-through;}
  /* Свит текст на дълга бележка — макс. 4 реда, после многоточие. Виж
     attachHandlers(), който след всеки render() мери scrollHeight и показва
     .expand-toggle бутона само ако текстът наистина прелива. */
  .note .txt.clamped{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .expand-toggle{
    -webkit-appearance:none;appearance:none;background:none;border:none;
    color:var(--accent-dim);padding:2px;display:inline-flex;align-items:center;justify-content:center;
    gap:3px;font-size:10.5px;font-weight:600;font-family:inherit;line-height:1;
  }
  .note .meta{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .note .tag{
    display:inline-block;font-size:10px;font-weight:600;
    padding:0 6px;border-radius:7px;letter-spacing:.3px;
  }
  .note.progress .tag{background:rgba(201,162,39,.18);color:var(--gold);}
  .note.done .tag{background:rgba(93,160,107,.18);color:var(--green);}
  .note .time{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

  .note-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .note-actions button{
    width:21px;height:21px;border:none;background:none;
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;
  }
  .note-actions button.del{color:var(--danger);}

  .edit-input{
    width:100%;background:var(--card-2);border:1px solid var(--accent-dim);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:15px;
    outline:none;font-family:inherit;resize:none;
  }
  /* Бутоните "Запази"/"Откажи" при редакция стоят точно под текста на
     бележката, подравнени вдясно — на същата страна, където обикновено са
     иконките за редакция/изтриване на бележката. */
  .edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .edit-actions button{
    width:34px;height:34px;border-radius:10px;border:none;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .edit-actions button.cancel{background:var(--card-2);color:var(--text-dim);border:1px solid var(--border);}
  .edit-actions button.save{background:var(--accent);color:var(--bg);}
  .edit-actions button:active{transform:scale(.94);}

  .subs{margin:6px 0 0 15px;padding-left:9px;border-left:2px solid var(--border);}
  .subs .note{padding:6px 8px;background:var(--card-2);}
  .subs .note-wrap{margin-bottom:4px;}
  /* В светлата тема разменяме местата — основните бележки по-тъмни
     (--card-2), подбележките по-светли (--card), обратно на тъмната тема.
     Пипаме само тук, не самите --card/--card-2 стойности (те се ползват и
     другаде — бутони, полета и т.н. — и не бива да се променят). */
  :root[data-theme="light"] .note{background:var(--card-2);}
  /* Малко по-тъмни от чисто --card (не колкото основните бележки, за да си
     личи разликата), между двата тона. */
  :root[data-theme="light"] .subs .note{background:#F7EEDC;}
  .add-sub-row{margin-top:6px;}
  .add-sub-link{
    background:none;border:none;color:var(--accent-dim);font-size:12.5px;
    font-weight:600;padding:2px 4px;
  }
  .add-sub-input-row{display:flex;gap:6px;margin-top:6px;}
  .add-sub-input-row input{
    flex:1;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;
  }
  .add-sub-input-row button.save{
    background:var(--accent);color:var(--bg);border:none;border-radius:10px;
    width:34px;display:flex;align-items:center;justify-content:center;
  }
  .add-sub-input-row button.cancel{
    background:none;border:none;color:var(--text-dim);padding:0 8px;
    display:flex;align-items:center;justify-content:center;
  }

  .empty{
    text-align:center;color:var(--text-dim);font-size:13px;
    padding:30px 10px;
  }

  /* Плаващо копче "най-нови", когато потребителят е скролнал нагоре
     (напр. след търсене) — за бързо връщане в края на хронологията. Скрито
     по подразбиране и се показва само чрез updateJumpVisibility(), която
     проверява разстоянието до дъното при скрол, resize и след всеки render. */
  .jump-btn{
    display:none;position:fixed;right:16px;z-index:11;
    bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
    background:var(--accent);color:var(--bg);border:none;border-radius:20px;
    padding:9px 14px;font-size:13px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    align-items:center;gap:6px;
  }
  .jump-btn.show{display:flex;}

function t(){ return STRINGS[lang]; }

// Мап за транслитерация Кирилица→Латиница (официалната БГ транслитерационна
// схема) — с него търсенето намира бележки без значение от езика/писмеността
// на заявката: "shte se obadya" намира "ще се обадя" и обратно.
const CYR_TO_LAT = {
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i',
  'й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s',
  'т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht',
  'ъ':'a','ь':'y','ю':'yu','я':'ya'
};
function toLatin(str){
  let out = '';
  for(const ch of str.toLowerCase()) out += CYR_TO_LAT[ch] !== undefined ? CYR_TO_LAT[ch] : ch;
  return out;
}
function textMatches(text, q, qLatin){
  const tx = (text||'').toLowerCase();
  if(!tx) return false;
  if(tx.includes(q)) return true;
  return toLatin(tx).includes(qLatin);
}

// Генерира различни форми на датата на дадена бележка (ISO, дд.мм.гггг,
// дд.мм, ден+месец на кирилица/латиница, ден от седмицата на двата езика,
// "днес"/"вчера" при съвпадение), за да могат бележките да се търсят и по
// дата, не само по текст.
function dateSearchStrings(ts){
  const d = new Date(ts);
  const iso = dateStr(ts);
  const day = d.getDate(), month = d.getMonth()+1, year = d.getFullYear();
  const dd = String(day).padStart(2,'0'), mm = String(month).padStart(2,'0');
  const strs = [
    iso,
    `${dd}.${mm}.${year}`, `${dd}.${mm}`, `${day}.${month}`,
    `${dd}/${mm}/${year}`, `${dd}/${mm}`, `${day}/${month}`,
    `${day} ${STRINGS.bg.monthNames[d.getMonth()]}`, `${day} ${STRINGS.en.monthNames[d.getMonth()]}`,
    STRINGS.bg.monthNames[d.getMonth()], STRINGS.en.monthNames[d.getMonth()],
    STRINGS.bg.dayNames[d.getDay()], STRINGS.en.dayNames[d.getDay()],
    String(year)
  ];
  const now = new Date(); now.setHours(0,0,0,0);
  const y = new Date(now); y.setDate(y.getDate()-1);
  const dd0 = new Date(d); dd0.setHours(0,0,0,0);
  if(dd0.getTime() === now.getTime()) strs.push('днес','today');
  if(dd0.getTime() === y.getTime()) strs.push('вчера','yesterday');
  return strs.map(s=>s.toLowerCase());
}
function dateMatches(ts, q, qLatin){
  return dateSearchStrings(ts).some(s => textMatches(s, q, qLatin));
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function dateStr(ts){ return new Date(ts).toISOString().slice(0,10); }

function dayLabel(ts){
  const d = new Date(ts);
  const now = new Date(); now.setHours(0,0,0,0);
  const y = new Date(now); y.setDate(y.getDate()-1);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  if(dd.getTime() === now.getTime()) return t().today;
  if(dd.getTime() === y.getTime()) return t().yesterday;
  return t().dayNames[d.getDay()] + ', ' + d.getDate() + ' ' + t().monthNames[d.getMonth()];
}

function timeLabel(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// Дата + час до всяка бележка — не само час, за да е ясно от кой ден е
// бележката дори в плоски изгледи (резултати от търсене, филтър по
// категория), които смесват бележки от различни дни без ден-заглавия.
function dateTimeLabel(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()} · ${timeLabel(ts)}`;
}

// страницата за instant UI и офлайн резервен вариант, докато чакаме Firebase
// да потвърди дали има активна Google сесия. Ще бъде презаписан от
// Firestore чрез loadFromCloud() след успешен вход.
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : [];
  }catch(e){ notes = []; }
  notes.forEach(n=>{ if(!n.subs) n.subs = []; if(n.tag===undefined) n.tag = null; });

// Превключва формата между "Вход" и "Регистрация" — само надписите се
// сменят, полетата (имейл/парола) остават същите. Викана и от
// applyStaticText() при смяна на езика, за да пасне на текущия режим.
function setAuthMode(mode){
  authMode = mode;
  const s = t();
  document.getElementById('authSubmitBtn').textContent = mode === 'signin' ? s.signInBtn : s.signUpBtn;
  document.getElementById('authToggleText').textContent = mode === 'signin' ? s.noAccountYet : s.haveAccountAlready;
  document.getElementById('toggleAuthModeBtn').textContent = mode === 'signin' ? s.signUpLink : s.signInLink;
  document.getElementById('authFormError').style.display = 'none';
  // Полето "Потвърди парола" се показва само при регистрация — при вход не
  // е нужно и не бива да пречи (display:none го изважда и от required
  // валидацията на браузъра автоматично).
  const isSignup = mode === 'signup';
  const confirmInput = document.getElementById('authPasswordConfirm');
  confirmInput.style.display = isSignup ? 'block' : 'none';
  confirmInput.required = isSignup;
  confirmInput.value = '';
}

// Вход/регистрация с имейл + парола (умишлено единственият начин за вход —
// без Google, за да не се показва firebaseapp.com при OAuth екрана).
// auth.onAuthStateChanged() поема нататък успешния вход.
function handleEmailAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authFormError');
  errEl.style.display = 'none';
  if(!email || !password) return;
  if(authMode === 'signup'){
    const confirm = document.getElementById('authPasswordConfirm').value;
    if(password !== confirm){
      errEl.textContent = t().errPasswordMismatch;
      errEl.style.display = 'block';
      return;
    }
  }
  showAuthScreen(true);
  const action = authMode === 'signin'
    ? auth.signInWithEmailAndPassword(email, password)
    : auth.createUserWithEmailAndPassword(email, password);
  action.catch(err=>{
    console.error('email auth failed', err);
    showAuthScreen(false);
    errEl.textContent = translateAuthError(err.code);
    errEl.style.display = 'block';
  });
}

function handleForgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  if(!email){ window.alert(t().enterEmailFirst); return; }
  auth.sendPasswordResetEmail(email)
    .then(()=> window.alert(t().resetEmailSent))
    .catch(err=> window.alert(translateAuthError(err.code)));
}

function translateAuthError(code){
  const s = t();
  const map = {
    'auth/invalid-email': s.errInvalidEmail,
    'auth/user-not-found': s.errUserNotFound,
    'auth/wrong-password': s.errWrongPassword,
    'auth/invalid-credential': s.errWrongPassword,
    'auth/email-already-in-use': s.errEmailInUse,
    'auth/weak-password': s.errWeakPassword,
    'auth/too-many-requests': s.errTooManyRequests,
    'auth/operation-not-allowed': s.errOperationNotAllowed
  };
  return map[code] || s.errGeneric;
}

function signOutUser(){
  if(!window.confirm(t().confirmLogout)) return;
  auth.signOut();
}

function renderProfileMenu(){
  const s = t();
  const panel = document.getElementById('profilePanel');
  const email = currentUser ? (currentUser.email || '') : '';
  let html = `<div class="profile-email">${escapeHtml(email)}</div>`;
  html += `<div class="color-row">` + PROFILE_COLORS.map(c =>
    `<button type="button" class="color-sw${c===profileColor?' active':''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`
  ).join('') + `</div>`;
  html += `<hr>`;
  html += `<button type="button" class="action" data-action="change-password">${ICONS.pencil}${s.changePassword}</button>`;
  html += `<button type="button" class="action" data-action="change-email">${ICONS.pencil}${s.changeEmail}</button>`;
  html += `<hr>`;
  html += `<button type="button" class="action danger" data-action="logout">${ICONS.close}${s.logoutBtn}</button>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.color-sw').forEach(b=>{

  panel.querySelector('[data-action="logout"]').addEventListener('mousedown', e=>{ e.preventDefault(); e.stopPropagation(); closeProfilePanel(); signOutUser(); });

function updateUserChip(user){

    chip.style.color = '';

    const initial = (user.displayName || user.email || '?').trim().charAt(0).toUpperCase();
    chip.textContent = initial;
    chip.style.color = profileColor;
  }

// Зарежда бележките на потребителя от Firestore (users/{uid}, поле notes —
// целият масив в един документ, достатъчно за личен списък с бележки).
// Ако документът още не съществува (първи вход) и вече имаме нещо в
// локалния кеш, го качваме автоматично в облака.
function loadFromCloud(uid){
  const docRef = db.collection('users').doc(uid);
  docRef.get().then(snap=>{
    if(snap.exists && Array.isArray(snap.data().notes)){
      notes = snap.data().notes;
      notes.forEach(n=>{ if(!n.subs) n.subs = []; if(n.tag===undefined) n.tag = null; });
    }else if(notes.length){
      docRef.set({ notes }, { merge:true }).catch(err=>console.error('initial cloud upload failed', err));
    }
    render();
    hideAuthScreen();
    setTimeout(()=>scrollToBottom(false), 0);
  }).catch(err=>{
    console.error('cloud load failed', err);
    render();
    hideAuthScreen();
  });
}

// Единственото място, което следи дали има вход — показва/скрива екрана за
// вход и стартира зареждането от облака при успешна сесия.
auth.onAuthStateChanged(user=>{
  currentUser = user;
  updateUserChip(user);
  if(user){
    loadFromCloud(user.uid);
  }else{
    notes = [];
    render();
    showAuthScreen(false);
  }
});

// Молим браузъра да третира данните ни като "persistent" — намалява шанса
// localStorage да бъде изтрит автоматично при недостиг на място (най-вече
// релевантно на iOS Safari). Не е гаранция сама по себе си, затова има и
// ръчния Export/Import резервно копие по-долу.
function requestPersistentStorage(){
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
}

function scrollToBottom(smooth){
  window.scrollTo({top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
}

function updateTopbarHeight(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
  catch(e){ console.error('save failed', e); }
  // Локалният кеш горе е instant (UI никога не чака мрежата); записът в
  // Firestore е "fire and forget" — грешка тук не блокира интерфейса,
  // localStorage служи и като офлайн буфер.
  if(currentUser){
    db.collection('users').doc(currentUser.uid).set({ notes }, { merge:true })
      .catch(err=>console.error('cloud save failed', err));
  }
}

function findNote(id){ return notes.find(n=>n.id===id); }
function findSub(noteId, subId){
  const n = findNote(noteId);
  return n ? n.subs.find(s=>s.id===subId) : null;
}

function addNote(text){
  text = text.trim();
  if(!text) return;
  notes.push({
    id: 'n'+Date.now()+Math.random().toString(36).slice(2,6),
    text, createdAt: Date.now(), status: 'open', subs: [], tag: null
  });
  save(); render();
  setTimeout(()=>scrollToBottom(true), 0);
}

function addSub(noteId, text){
  text = text.trim();
  if(!text) return;
  const n = findNote(noteId);
  if(!n) return;
  n.subs.push({
    id: 's'+Date.now()+Math.random().toString(36).slice(2,6),
    text, createdAt: Date.now(), status: 'open'
  });
  addingSubFor = null;
  save(); render();
}

function cancelSub(){
  addingSubFor = null;
  render();
}

function cycleStatus(noteId, subId){
  const target = subId ? findSub(noteId, subId) : findNote(noteId);
  if(!target) return;
  target.status = target.status === 'open' ? 'progress' : target.status === 'progress' ? 'done' : 'open';
  save(); render();
  // Смяната на статус премества бележката в друга секция (Приключени/В
  // прогрес/Активни) — без това щеше просто да "изчезне" от погледа.
  // Проследяваме я до новата ѝ позиция с плавен скрол.
  scrollToNote(subId ? noteId+'::'+subId : noteId);
}

// Намира бележка/подбележка по нейния ключ (виж itemRow()) в текущия DOM
// (след render()) и я скролва плавно в центъра на видимата зона.
function scrollToNote(key){
  const el = document.querySelector(`.txt[data-key="${key}"]`);
  if(!el) return;
  const wrap = el.closest('.note-wrap');
  if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'center'});
}

function removeItem(noteId, subId){
  if(subId){
    const n = findNote(noteId);
    if(n) n.subs = n.subs.filter(s=>s.id!==subId);
  }else{
    notes = notes.filter(n=>n.id!==noteId);
  }
  save(); render();
}

function commitEdit(noteId, subId, value){
  const target = subId ? findSub(noteId, subId) : findNote(noteId);
  const v = value.trim();
  if(target && v) target.text = v;
  editingKey = null;
  save(); render();
}

function cancelEdit(){
  editingKey = null;
  render();
}

function setNoteTag(noteId, tag){
  const n = findNote(noteId);
  if(!n) return;
  n.tag = tag || null;
  save(); render();
}

// Плаващ picker за смяна на тага на бележка — единствен споделен елемент,
// позициониран спрямо тапнатото тагче с getBoundingClientRect()
// (position:fixed, viewport-относителни координати). Произволните тагове
// НЕ се показват тук като готови бутони за избор — те са моментни, пишат се
// наново всеки път; само Личен/Работни са трайните бързи опции.
function openTagPicker(noteId, anchorEl){
  activeTagNoteId = noteId;
  let html = `
    <button data-set="personal"><span class="sw" style="background:var(--tag-personal)"></span>${t().tagPersonal}</button>
    <button data-set="work"><span class="sw" style="background:var(--tag-work)"></span>${t().tagWork}</button>
    <hr><div class="tag-newrow">
      <input type="text" id="newTagInput" placeholder="${t().newTagPlaceholder}" maxlength="24">
      <button type="button" class="tag-confirm" id="newTagConfirm" aria-label="${t().saveAria}">${ICONS.check}</button>
    </div>
    <hr><button data-set=""><span class="sw" style="background:var(--text-dim)"></span>${t().noTag}</button>`;

  const picker = document.getElementById('tagPicker');
  picker.innerHTML = html;
  const rect = anchorEl.getBoundingClientRect();
  picker.style.top = (rect.bottom + 4) + 'px';
  picker.style.left = Math.min(rect.left, window.innerWidth - 176) + 'px';
  picker.classList.add('show');

  picker.querySelectorAll('button[data-set]').forEach(b=>{
    b.addEventListener('mousedown', e=>{
      e.preventDefault();
      setNoteTag(activeTagNoteId, b.dataset.set);
      closeTagPicker();
    });
  });
  const inp = document.getElementById('newTagInput');
  const confirmNewTag = () => {
    const v = inp.value.trim();
    if(v){ setNoteTag(activeTagNoteId, v); closeTagPicker(); }
  };
  inp.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ confirmNewTag(); }
    if(e.key === 'Escape'){ closeTagPicker(); }
  });
  document.getElementById('newTagConfirm').addEventListener('mousedown', e=>{
    e.preventDefault();
    confirmNewTag();
  });
  // Съзнателно НЕ фокусираме input-а автоматично — повечето пъти потребителят
  // просто избира съществуващ таг с едно тапване; клавиатурата да изскача
  // веднага би пречела на picker-а. Полето за нов таг чака ръчно тапване.
}
function closeTagPicker(){
  document.getElementById('tagPicker').classList.remove('show');
  activeTagNoteId = null;
}

// Резервно копие на бележките — вече Firestore е основното трайно
// съхранение (виж save()/loadFromCloud()), но локален файл е полезен за
// ръчна миграция между акаунти или пълна офлайн застраховка.
function exportNotes(){
  const data = JSON.stringify(notes, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iforget-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importNotesFromFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('invalid backup');
      if(!window.confirm(t().confirmImport)) return;
      notes = parsed;
      notes.forEach(n=>{ if(!n.subs) n.subs = []; if(n.tag===undefined) n.tag = null; });
      save(); render();
      closeSettingsPanel();
      window.alert(t().importSuccess);
    }catch(err){
      window.alert(t().importError);
    }
  };
  reader.readAsText(file);
}

function openSettingsPanel(anchorEl){
  const html = `
    <button class="action" data-action="export"><span>${ICONS.download}</span>${t().exportBackup}</button>
    <button class="action" data-action="import"><span>${ICONS.upload}</span>${t().importBackup}</button>
    <hr><div class="hint">${t().backupHint}</div>`;
  const panel = document.getElementById('settingsPanel');
  panel.innerHTML = html;
  const rect = anchorEl.getBoundingClientRect();
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.right = (window.innerWidth - rect.right) + 'px';
  panel.classList.add('show');

  panel.querySelector('[data-action="export"]').addEventListener('mousedown', e=>{
    e.preventDefault();
    exportNotes();
    closeSettingsPanel();
  });
  panel.querySelector('[data-action="import"]').addEventListener('mousedown', e=>{
    e.preventDefault();
    document.getElementById('importFileInput').click();
  });
}
function closeSettingsPanel(){
  document.getElementById('settingsPanel').classList.remove('show');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Категория/таг на бележка: 'personal' и 'work' са вградени (превеждат се
// според избрания език), всичко друго е свободно въведен текст от
// потребителя и се показва буквално, без превод.
function tagLabel(tag){
  if(tag === 'personal') return t().tagPersonal;
  if(tag === 'work') return t().tagWork;
  return tag;
}
function tagClass(tag){
  if(tag === 'personal') return 'personal';
  if(tag === 'work') return 'work';
  return 'custom';
}
// Всички тагове, които има смисъл да се показват за филтриране — вградените
// винаги (дори с 0 бележки, за да са видими като предложени категории), плюс
// всеки произволен таг, който в момента се ползва от поне една бележка.
function allTagsInUse(){
  const custom = new Set();
  notes.forEach(n=>{ if(n.tag && !BUILTIN_TAGS.includes(n.tag)) custom.add(n.tag); });
  return [...BUILTIN_TAGS, ...[...custom].sort((a,b)=>a.localeCompare(b))];
}
function tagPillHtml(item, noteId){
  const val = item.tag || '';
  const cls = val ? tagClass(val) : 'empty';
  const label = val ? escapeHtml(tagLabel(val)) : t().addTag;
  return `<button class="tag-pill ${cls}" data-action="tag-open" data-note="${noteId}">${label}</button>`;
}

function itemRow(item, noteId, isSub){
  const key = isSub ? noteId+'::'+item.id : item.id;
  const icon = item.status === 'done' ? ICONS.checkSmall : '';
  const tagText = item.status === 'progress' ? t().tagProgress : item.status === 'done' ? t().tagDone : '';

  if(editingKey === key){
    // Бутоните "Запази"/"Откажи" стоят точно под текста, подравнени вдясно
    // (както обичайно стоят иконките за редакция/изтриване). .note-main е
    // същият ред дот+тяло, обвит отделно от .note-top (виж нормалния изглед
    // по-долу) — при редакция просто няма нужда от горен ред с дата/час.
    return `<div class="note-wrap">
      <div class="note ${item.status}">
        <div class="note-main">
          <div class="dot">${icon}</div>
          <div class="body">
            <textarea class="edit-input" rows="2" data-editkey="${key}">${escapeHtml(item.text)}</textarea>
            <div class="edit-actions">
              <button class="cancel" data-action="edit-cancel" aria-label="${t().cancelAria}">${ICONS.close}</button>
              <button class="save" data-action="edit-save" data-editkey="${key}" aria-label="${t().saveAria}">${ICONS.check}</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  // Дълъг текст: свит по подразбиране на 4 реда (.clamped), докато
  // потребителят не го разгъне ръчно (expandedNotes) — бутонът за
  // разгъване/свиване се показва само ако текстът наистина прелива, виж
  // проверката с scrollHeight в attachHandlers().
  const isExpanded = expandedNotes.has(key);
  return `<div class="note-wrap">
    <div class="note ${item.status}">
      <div class="note-top"><span class="time">${dateTimeLabel(item.createdAt)}</span></div>
      <div class="note-main">
        <div class="dot" data-action="cycle" data-note="${noteId}" data-sub="${isSub?item.id:''}">${icon}</div>
        <div class="body">
          <div class="txt${!isExpanded ? ' clamped' : ''}" data-key="${key}" data-action="edit" data-note="${noteId}" data-sub="${isSub?item.id:''}">${escapeHtml(item.text)}</div>
          <div class="meta">
            ${!isSub ? tagPillHtml(item, noteId) : ''}
            ${!isSub && addingSubFor !== noteId ? `<button class="add-sub-link" data-action="sub-open" data-note="${noteId}">${t().addSubLink}</button>` : ''}
            ${tagText ? `<span class="tag">${tagText}</span>` : ''}
            <button class="expand-toggle" data-action="toggle-expand" data-key="${key}" style="display:${isExpanded?'inline-flex':'none'}" aria-label="${isExpanded?t().collapseAria:t().expandAria}">${isExpanded?t().collapseAria:t().expandAria}${isExpanded?ICONS.chevronUp:ICONS.chevronDown}</button>
          </div>
        </div>
        <div class="note-actions">
          <button data-action="edit" data-note="${noteId}" data-sub="${isSub?item.id:''}">${ICONS.pencil}</button>
          <button class="del" data-action="del" data-note="${noteId}" data-sub="${isSub?item.id:''}">${ICONS.close}</button>
        </div>
      </div>
    </div>
    ${!isSub ? subsBlock(item) : ''}
  </div>`;
}

function subsBlock(note){
  let html = '';
  if(note.subs && note.subs.length){
    html += `<div class="subs">${note.subs.map(s=>itemRow(s, note.id, true)).join('')}</div>`;
  }
  // Бутонът "+ подбележка" вече стои горе в .meta реда (до тага) — тук
  // остава само активното поле за въвеждане, докато трае добавянето.
  if(addingSubFor === note.id){
    html += `<div class="add-sub-row" style="margin-left:20px;">
      <div class="add-sub-input-row">
        <input type="text" class="sub-input" data-note="${note.id}" placeholder="${t().subPlaceholder}" maxlength="300">
        <button class="save" data-action="sub-save" data-note="${note.id}" aria-label="${t().saveAria}">${ICONS.check}</button>
        <button class="cancel" data-action="sub-cancel" data-note="${note.id}" aria-label="${t().cancelAria}">${ICONS.close}</button>
      </div>
    </div>`;
  }
  return html;
}

// Всеки статус е отделен блок с ясно заглавие (status-section), подреден
// отгоре надолу: Приключени → В прогрес → Активни (най-близо до лентата за
// писане). Вътре във всеки блок бележките вървят хронологично по дни
// (най-старите горе).
function statusGroupHtml(items, forceTodayIfEmpty){
  const byDay = {};
  items.forEach(n=>{
    const k = dateStr(n.createdAt);
    (byDay[k] = byDay[k] || []).push(n);
  });
  const dayKeys = Object.keys(byDay).sort();
  if(forceTodayIfEmpty && !dayKeys.includes(todayStr())) dayKeys.push(todayStr());

  let html = '';
  dayKeys.forEach(k=>{
    const dayItems = byDay[k] || [];
    html += `<div class="day-block">
      <div class="day-label">${dayLabel(k+'T00:00:00')}${dayItems.length?`<span class="count">${dayItems.length}</span>`:''}</div>
      ${dayItems.length ? dayItems.map(n=>itemRow(n, n.id, false)).join('') : `<div class="empty">${t().noNotes}</div>`}
    </div>`;
  });
  return html;
}

function sectionHeader(label, count, cls){
  return `<div class="status-section ${cls}"><span class="status-section-dot"></span>${label}<span class="status-section-count">${count}</span></div>`;
}

// Пресъздава чиповете в реда с категории (Всички + Лични/Работни/произволни,
// всеки с брояч). Вика се при всеки render(), за да са бройките и активното
// състояние винаги верни, без значение откъде е дошла промяната.
function renderCatRow(){
  const counts = {};
  notes.forEach(n=>{ if(n.tag) counts[n.tag] = (counts[n.tag]||0) + 1; });
  let html = `<button class="cat-chip${categoryFilter===null?' active':''}" data-action="cat-filter" data-cat="">${t().catAll}</button>`;
  allTagsInUse().forEach(tg=>{
    const n = counts[tg] || 0;
    html += `<button class="cat-chip${categoryFilter===tg?' active':''}" data-action="cat-filter" data-cat="${escapeHtml(tg)}">${escapeHtml(tagLabel(tg))}${n?`<span class="n">${n}</span>`:''}</button>`;
  });
  document.getElementById('catRow').innerHTML = html;
}

function render(){
  renderCatRow();
  const q = searchQuery.trim().toLowerCase();

  // Докато търсим: показваме плосък списък с "предложения" веднага, докато
  // потребителят пише — всички съвпадащи бележки, без значение от статуса
  // им, сортирани по последна активност (най-скорошните най-горе), без
  // разделяне по статус/дни. Съвпадението работи по текст (кирилица ⇄
  // латиница чрез транслитерация) и по дата (ISO, дд.мм, ден от седмицата,
  // месец, "днес"/"вчера" и т.н.). Щом полето се изчисти, се връщаме към
  // нормалния изглед, групиран по статус.
  if(q){
    const qLatin = toLatin(q);
    const noteHit = n =>
      textMatches(n.text, q, qLatin) ||
      dateMatches(n.createdAt, q, qLatin) ||
      (n.subs||[]).some(s => textMatches(s.text, q, qLatin) || dateMatches(s.createdAt, q, qLatin));
    const results = notes.filter(noteHit).sort((a,b)=>b.createdAt-a.createdAt);

    const html = results.length
      ? `<div class="day-block">
          <div class="day-label">${t().results}<span class="count">${results.length}</span></div>
          ${results.map(n=>itemRow(n, n.id, false)).join('')}
        </div>`
      : `<div class="empty">${t().noResultsFor(escapeHtml(searchQuery.trim()))}</div>`;

    document.getElementById('activeArea').innerHTML = html;
    updateTopbarHeight();
    attachHandlers();
    updateJumpVisibility();
    return;
  }

  // Филтър по категория: плосък списък (както при търсене), без разделяне
  // по статус — просто всички бележки с избрания таг, най-новите горе.
  if(categoryFilter){
    const filtered = notes.filter(n => n.tag === categoryFilter).sort((a,b)=>b.createdAt-a.createdAt);
    const html = filtered.length
      ? `<div class="day-block">
          <div class="day-label">${escapeHtml(tagLabel(categoryFilter))}<span class="count">${filtered.length}</span></div>
          ${filtered.map(n=>itemRow(n, n.id, false)).join('')}
        </div>`
      : `<div class="empty">${t().noNotesForTag}</div>`;

    document.getElementById('activeArea').innerHTML = html;
    updateTopbarHeight();
    attachHandlers();
    updateJumpVisibility();
    return;
  }

  const byStatus = status => notes.filter(n => (n.status||'open') === status).sort((a,b)=>a.createdAt-b.createdAt);
  const done = byStatus('done');
  const progress = byStatus('progress');
  const open = byStatus('open');

  let html = '';
  if(done.length) html += sectionHeader(t().sectionDone, done.length, 'done') + statusGroupHtml(done, false);
  if(progress.length) html += sectionHeader(t().sectionProgress, progress.length, 'progress') + statusGroupHtml(progress, false);
  // "Активни" секцията винаги се показва (най-близо до лентата), с "Днес"
  // блок дори когато е празна — покана да напишеш нещо.
  html += sectionHeader(t().sectionActive, open.length, 'active') + statusGroupHtml(open, true);

  document.getElementById('activeArea').innerHTML = html;
  updateTopbarHeight();
  attachHandlers();
  updateJumpVisibility();
}

function attachHandlers(){
  // Показва бутона за разгъване само ако свитият текст наистина прелива
  // (scrollHeight > clientHeight) — иначе за къси бележки бутонът просто не
  // се появява. Бележки, които потребителят вече е разгънал ръчно, нямат
  // .clamped клас тук (вече са разгънати), затова не влизат в тази проверка.
  document.querySelectorAll('.txt.clamped').forEach(el=>{
    if(el.scrollHeight > el.clientHeight + 1){
      const btn = document.querySelector(`.expand-toggle[data-key="${el.dataset.key}"]`);
      if(btn) btn.style.display = 'inline-flex';
    }
  });
  document.querySelectorAll('[data-action="toggle-expand"]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const key = el.dataset.key;
      if(expandedNotes.has(key)) expandedNotes.delete(key); else expandedNotes.add(key);
      render();
    });
  });
  document.querySelectorAll('[data-action="cycle"]').forEach(el=>{
    el.addEventListener('click', ()=>cycleStatus(el.dataset.note, el.dataset.sub||null));
  });
  // Изтриването вече иска потвърждение — предпазва от случаен допир.
  document.querySelectorAll('[data-action="del"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(window.confirm(t().confirmDelete)) removeItem(el.dataset.note, el.dataset.sub||null);
    });
  });
  document.querySelectorAll('[data-action="tag-open"]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      openTagPicker(el.dataset.note, el);
    });
  });
  document.querySelectorAll('[data-action="edit"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const noteId = el.dataset.note, subId = el.dataset.sub || null;
      editingKey = subId ? noteId+'::'+subId : noteId;
      addingSubFor = null;
      render();
    });
  });
  // Фокусираме textarea веднага, синхронно, в рамките на същия event-стек
  // като клика/допира, който я е отворил — на iOS Safari клавиатурата се
  // показва автоматично само ако focus() се извика синхронно вътре в
  // потребителски жест, а не след setTimeout/забавяне.
  document.querySelectorAll('.edit-input').forEach(el=>{
    el.focus();
    el.selectionStart = el.value.length;
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        const [noteId, subId] = el.dataset.editkey.split('::');
        commitEdit(noteId, subId||null, el.value);
      }
      if(e.key === 'Escape'){ cancelEdit(); }
    });
    el.addEventListener('blur', ()=>{
      if(editingKey === null) return;
      const [noteId, subId] = el.dataset.editkey.split('::');
      commitEdit(noteId, subId||null, el.value);
    });
  });
  document.querySelectorAll('[data-action="edit-save"]').forEach(el=>{
    // mousedown, не click — за да се задейства преди textarea да загуби
    // фокус (blur вече записва стойността, но явният бутон трябва да е
    // надежден дори ако blur-логиката бъде пропусната).
    el.addEventListener('mousedown', e=>{
      e.preventDefault();
      const ta = document.querySelector('.edit-input[data-editkey="'+el.dataset.editkey+'"]');
      if(ta){
        const [noteId, subId] = el.dataset.editkey.split('::');
        commitEdit(noteId, subId||null, ta.value);
      }
    });
  });
  document.querySelectorAll('[data-action="edit-cancel"]').forEach(el=>{
    el.addEventListener('mousedown', e=>{ e.preventDefault(); cancelEdit(); });
  });
  document.querySelectorAll('[data-action="sub-open"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      addingSubFor = el.dataset.note;
      editingKey = null;
      render();
      // Синхронно, без setTimeout — за да отвори клавиатурата от първия допир.
      const inp = document.querySelector('.sub-input[data-note="'+el.dataset.note+'"]');
      if(inp) inp.focus();
    });
  });
  document.querySelectorAll('[data-action="sub-save"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const inp = document.querySelector('.sub-input[data-note="'+el.dataset.note+'"]');
      if(inp) addSub(el.dataset.note, inp.value);
    });
  });
  document.querySelectorAll('[data-action="sub-cancel"]').forEach(el=>{
    el.addEventListener('click', ()=>cancelSub());
  });
  document.querySelectorAll('.sub-input').forEach(el=>{
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ addSub(el.dataset.note, el.value); }
      if(e.key === 'Escape'){ cancelSub(); }
    });
  });
}

const noteInput = document.getElementById('noteInput');
const noteCancelBtn = document.getElementById('noteCancelBtn');

function clearNoteInput(){
  noteInput.value = '';
  noteCancelBtn.classList.remove('show');
  noteInput.blur();
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  addNote(noteInput.value);
  noteInput.value = '';
  noteCancelBtn.classList.remove('show');
  noteInput.focus();
});
noteInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    addNote(e.target.value);
    e.target.value = '';
    noteCancelBtn.classList.remove('show');
  }
  if(e.key === 'Escape'){ clearNoteInput(); }
});
// Показва бутона за отказ само докато има написан текст — щом полето е
// празно, той просто не пречи.
noteInput.addEventListener('input', ()=>{
  noteCancelBtn.classList.toggle('show', noteInput.value.length > 0);
});
noteCancelBtn.addEventListener('mousedown', e=>{ e.preventDefault(); clearNoteInput(); });

const searchBtn = document.getElementById('searchBtn');
const searchRow = document.getElementById('searchRow');
const searchInput = document.getElementById('searchInput');
const catBtn = document.getElementById('catBtn');
const catRow = document.getElementById('catRow');

function closeCatRow(){ catRow.classList.remove('open'); catBtn.classList.remove('active'); }
function closeSearchRow(){ searchRow.classList.remove('open'); searchBtn.classList.remove('active'); }

searchBtn.addEventListener('click', ()=>{
  const open = searchRow.classList.toggle('open');
  searchBtn.classList.toggle('active', open);
  if(open){ closeCatRow(); closeSettingsPanel(); closeProfilePanel(); }
  updateTopbarHeight();
  if(open){ searchInput.focus(); }
  else{ searchQuery=''; searchInput.value=''; render(); }
});
searchInput.addEventListener('input', e=>{ searchQuery = e.target.value; render(); });
document.getElementById('searchClear').addEventListener('click', ()=>{
  searchQuery=''; searchInput.value=''; searchInput.focus(); render();
});

// Категории: тапването на иконата отваря/затваря реда с чипове (взаимно
// изключващ се с търсенето, за да не се струпват два реда наведнъж). Самите
// чипове се регенерират при всеки render(), затова слушателят е делегиран
// върху постоянния контейнер #catRow, а не се закача наново всеки път.
catBtn.addEventListener('click', ()=>{
  const open = catRow.classList.toggle('open');
  catBtn.classList.toggle('active', open);
  if(open){ closeSearchRow(); closeSettingsPanel(); closeProfilePanel(); }
  updateTopbarHeight();
});
catRow.addEventListener('click', e=>{
  const chip = e.target.closest('[data-action="cat-filter"]');
  if(!chip) return;
  categoryFilter = chip.dataset.cat || null;
  render();
});

// Настройки (резервно копие) — плаващ панел, аналогичен на tag-picker,
// закачен под settingsBtn; затваря се взаимно с реда за търсене/категории.
const settingsBtn = document.getElementById('settingsBtn');
settingsBtn.addEventListener('click', ()=>{
  const panel = document.getElementById('settingsPanel');
  const isOpen = panel.classList.contains('show');
  if(isOpen){ closeSettingsPanel(); return; }
  closeSearchRow(); closeCatRow(); closeProfilePanel();
  openSettingsPanel(settingsBtn);
});
document.getElementById('importFileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) importNotesFromFile(file);
  e.target.value = '';
});

// Профил — плаващ панел (цвят на буквата, смяна на парола/имейл, изход),
// закачен под userChip; затваря се взаимно с останалите редове/панели.
const userChip = document.getElementById('userChip');
userChip.addEventListener('click', ()=>{
  const panel = document.getElementById('profilePanel');
  const isOpen = panel.classList.contains('show');
  if(isOpen){ closeProfilePanel(); return; }
  closeSearchRow(); closeCatRow(); closeSettingsPanel();
  openProfilePanel(userChip);
});

// Затваря tag-picker-а/настройките/профила при клик извън тях (и извън
// бутоните, които ги отварят).
document.addEventListener('mousedown', e=>{
  const picker = document.getElementById('tagPicker');
  if(picker.classList.contains('show') && !picker.contains(e.target) && !e.target.closest('[data-action="tag-open"]')){
    closeTagPicker();
  }
  const panel = document.getElementById('settingsPanel');
  if(panel.classList.contains('show') && !panel.contains(e.target) && e.target !== settingsBtn && !settingsBtn.contains(e.target)){
    closeSettingsPanel();
  }
  const profPanel = document.getElementById('profilePanel');
  if(profPanel.classList.contains('show') && !profPanel.contains(e.target) && e.target !== userChip && !userChip.contains(e.target)){
    closeProfilePanel();
  }
});

document.getElementById('themeBtn').addEventListener('click', ()=>{
  theme = theme === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, theme);
  applyTheme();
});
document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = lang === 'bg' ? 'en' : 'bg';
  localStorage.setItem(LANG_KEY, lang);
  applyStaticText();
  render();
});

// Плаващо копче "най-нови" — появява се само ако потребителят е скролнал
// значително далеч от дъното (напр. докато преглежда резултати от търсене),
// и се скрива веднага щом сме близо до края — не пречи, докато пишем.
// Проверяваме при скрол, при resize и след всеки render (съдържанието може
// да е пораснало/намаляло височина без събитие "scroll").
const jumpBtn = document.getElementById('jumpBtn');
function updateJumpVisibility(){
  const fromBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
  jumpBtn.classList.toggle('show', fromBottom > 120);
}
window.addEventListener('scroll', updateJumpVisibility);
window.addEventListener('resize', updateJumpVisibility);
jumpBtn.addEventListener('click', ()=>scrollToBottom(true));

window.addEventListener('resize', updateTopbarHeight);

// iOS Safari премества/"вдига" position:fixed елементи неточно, когато се
// покаже клавиатурата (класически бъг) — вместо да разчитаме на fixed
// самичко, следим visualViewport и изтласкваме лентата за нова бележка точно
// над клавиатурата ръчно, без скок.
function handleViewportResize(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  const offset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  const tr = offset ? `translateY(-${offset}px)` : '';
  const bar = document.getElementById('bottomBar');
  if(bar) bar.style.transform = tr;
  updateJumpVisibility();
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', handleViewportResize);
  window.visualViewport.addEventListener('scroll', handleViewportResize);
}

document.getElementById('emailAuthForm').addEventListener('submit', handleEmailAuthSubmit);
document.getElementById('forgotPasswordBtn').addEventListener('mousedown', e=>{ e.preventDefault(); handleForgotPassword(); });
document.getElementById('toggleAuthModeBtn').addEventListener('mousedown', e=>{
  e.preventDefault();
  setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
});

applyTheme();
applyStaticText();
requestPersistentStorage();
// Показваме екрана за вход веднага в "зареждане" вид, докато Firebase
// провери дали вече има активна сесия — обикновено е бързо, но не е
// мигновено. Локалният кеш зарежда notes веднага (instant/офлайн UI); ще
// бъде презаписан от Firestore при потвърден вход (виж loadFromCloud()).
showAuthScreen(true);
loadLocalCache();
</script>
</body>

<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IForget">
<meta name="theme-color" content="#0B1220">
<title>IForget</title>
<style>
  :root{
    --bg:#0B1220;
    --card:#141E33;
    --card-2:#1C2A47;
    --border:#2B3D5E;
    --text:#EDF1F7;
    --text-dim:#8A96AC;
    --gold:#D9A62B;
    --gold-dim:#9C7A1E;
    --accent:#4C8DFF;
    --accent-dim:#3568B8;
    --green:#4FAE72;
    --danger:#E0574C;
    --topbar-h:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
    -webkit-font-smoothing:antialiased;height:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;}

  .topbar{
    position:sticky;top:0;z-index:20;flex-shrink:0;
    background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{
    font-size:16px;font-weight:700;letter-spacing:.3px;color:var(--accent);
    margin:0;
  }
  #searchBtn{
    background:none;border:none;color:var(--text-dim);font-size:17px;
    padding:2px 6px;line-height:1;
  }
  #searchBtn.active{color:var(--accent);}
  .search-row{display:none;gap:8px;margin-top:10px;}
  .search-row.open{display:flex;}
  .search-row input{
    flex:1;background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:9px 12px;font-size:14px;outline:none;
  }
  .search-row input:focus{border-color:var(--accent-dim);}
  .search-row button{
    background:none;border:none;color:var(--text-dim);font-size:13px;padding:4px 8px;
  }

  /* Активната зона запълва останалото пространство и подрежда съдържанието
     си долу (justify-content:flex-end) — така при малко бележки те стоят
     залепени до полето за писане, а не окачени горе с празно място под тях.
     Когато бележките станат повече от наличното място, изтласкват се нагоре
     естествено, както в чат приложение. */
  main{
    padding:6px 14px 0;padding-bottom:88px;
    flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;
  }

  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:linear-gradient(0deg,var(--bg) 82%,transparent);
    padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .input-row{display:flex;gap:8px;}
  #noteInput{
    flex:1;background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:14px;padding:12px 14px;font-size:16px;
    outline:none;
  }
  #noteInput:focus{border-color:var(--accent-dim);}
  #addBtn{
    width:44px;height:44px;border-radius:14px;border:none;
    background:var(--accent);color:var(--bg);font-size:22px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  #addBtn:active{transform:scale(.94);}

  /* Заглавието на деня е "залепено" точно под topbar-а, докато скролваш —
     така винаги се вижда в коя дата от хронологията се намираш. */
  .day-block{margin-top:20px;}
  .day-label{
    position:sticky;top:var(--topbar-h);z-index:5;background:var(--bg);
    font-size:12px;font-weight:600;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px 4px;
    padding:4px 0;
    display:flex;align-items:center;gap:8px;
  }
  .day-label .count{
    background:var(--card-2);color:var(--accent);border-radius:8px;
    padding:1px 7px;font-size:11px;font-weight:600;
  }

  .note-wrap{margin-bottom:8px;}
  .note{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:11px 12px;display:flex;align-items:flex-start;gap:10px;
  }
  .note .dot{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;
    border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;
  }
  .note.progress .dot{border-color:var(--gold);background:rgba(201,162,39,.15);}
  .note.done .dot{border-color:var(--green);background:var(--green);color:#0E1A10;}
  .note .body{flex:1;min-width:0;}
  .note .txt{font-size:15px;line-height:1.4;word-break:break-word;}
  .note.done .txt{color:var(--text-dim);text-decoration:line-through;}
  .note .meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
  .note .tag{
    display:inline-block;font-size:11px;font-weight:600;
    padding:1px 7px;border-radius:7px;letter-spacing:.3px;
  }
  .note.progress .tag{background:rgba(201,162,39,.18);color:var(--gold);}
  .note.done .tag{background:rgba(93,160,107,.18);color:var(--green);}
  .note .time{font-size:11px;color:var(--text-dim);}

  .note-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .note-actions button{
    width:26px;height:26px;border:none;background:none;
    color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .note-actions button.del{color:var(--danger);}

  .edit-input{
    width:100%;background:var(--card-2);border:1px solid var(--accent-dim);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:15px;
    outline:none;font-family:inherit;resize:none;
  }

  .subs{margin:8px 0 0 20px;padding-left:12px;border-left:2px solid var(--border);}
  .subs .note{padding:8px 10px;background:var(--card-2);}
  .subs .note-wrap{margin-bottom:6px;}
  .add-sub-row{margin-top:6px;}
  .add-sub-link{
    background:none;border:none;color:var(--accent-dim);font-size:12.5px;
    font-weight:600;padding:2px 4px;
  }
  .add-sub-input-row{display:flex;gap:6px;margin-top:6px;}
  .add-sub-input-row input{
    flex:1;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;
  }
  .add-sub-input-row button{
    background:var(--accent);color:var(--bg);border:none;border-radius:10px;
    padding:0 12px;font-size:13px;font-weight:600;
  }

  .empty{
    text-align:center;color:var(--text-dim);font-size:13px;
    padding:30px 10px;
  }

  /* Плаващо копче "най-нови", когато потребителят е скролнал нагоре
     (напр. след търсене) — за бързо връщане в края на хронологията. */
  .jump-btn{
    display:none;position:fixed;right:16px;z-index:11;
    bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
    background:var(--accent);color:var(--bg);border:none;border-radius:20px;
    padding:9px 16px;font-size:13px;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .jump-btn.show{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <h1>IForget</h1>
    <button id="searchBtn" aria-label="Търсене">&#128269;</button>
  </div>
  <div class="search-row" id="searchRow">
    <input id="searchInput" type="text" placeholder="Търси в бележките...">
    <button id="searchClear">&#10005;</button>
  </div>
</div>

<main id="activeArea"></main>

<button class="jump-btn" id="jumpBtn">&#8595; Най-нови</button>

<div class="bottombar">
  <div class="input-row">
    <input id="noteInput" type="text" placeholder="Нова бележка..." maxlength="500">
    <button id="addBtn">+</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'notes';
let notes = [];
let editingKey = null;
let addingSubFor = null;
let searchQuery = '';

const dayNames = ['Неделя','Понеделник','Вторник','Сряда','Четвъртък','Петък','Събота'];
const monthNames = ['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];

function todayStr(){ return new Date().toISOString().slice(0,10); }
function dateStr(ts){ return new Date(ts).toISOString().slice(0,10); }

function dayLabel(ts){
  const d = new Date(ts);
  const t = new Date(); t.setHours(0,0,0,0);
  const y = new Date(t); y.setDate(y.getDate()-1);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  if(dd.getTime() === t.getTime()) return 'Днес';
  if(dd.getTime() === y.getTime()) return 'Вчера';
  return dayNames[d.getDay()] + ', ' + d.getDate() + ' ' + monthNames[d.getMonth()];
}

function timeLabel(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : [];
  }catch(e){ notes = []; }
  notes.forEach(n=>{ if(!n.subs) n.subs = []; });
  render();
  setTimeout(()=>scrollToBottom(false), 0);
}

function scrollToBottom(smooth){
  window.scrollTo({top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
}

function updateTopbarHeight(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
  catch(e){ console.error('save failed', e); }
}

function findNote(id){ return notes.find(n=>n.id===id); }
function findSub(noteId, subId){
  const n = findNote(noteId);
  return n ? n.subs.find(s=>s.id===subId) : null;
}

function addNote(text){
  text = text.trim();
  if(!text) return;
  notes.push({
    id: 'n'+Date.now()+Math.random().toString(36).slice(2,6),
    text, createdAt: Date.now(), status: 'open', subs: []
  });
  save(); render();
  setTimeout(()=>scrollToBottom(true), 0);
}

function addSub(noteId, text){
  text = text.trim();
  if(!text) return;
  const n = findNote(noteId);
  if(!n) return;
  n.subs.push({
    id: 's'+Date.now()+Math.random().toString(36).slice(2,6),
    text, createdAt: Date.now(), status: 'open'
  });
  addingSubFor = null;
  save(); render();
}

function cycleStatus(noteId, subId){
  const target = subId ? findSub(noteId, subId) : findNote(noteId);
  if(!target) return;
  target.status = target.status === 'open' ? 'progress' : target.status === 'progress' ? 'done' : 'open';
  save(); render();
}

function removeItem(noteId, subId){
  if(subId){
    const n = findNote(noteId);
    if(n) n.subs = n.subs.filter(s=>s.id!==subId);
  }else{
    notes = notes.filter(n=>n.id!==noteId);
  }
  save(); render();
}

function commitEdit(noteId, subId, value){
  const target = subId ? findSub(noteId, subId) : findNote(noteId);
  const v = value.trim();
  if(target && v) target.text = v;
  editingKey = null;
  save(); render();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function itemRow(item, noteId, isSub){
  const key = isSub ? noteId+'::'+item.id : item.id;
  const icon = item.status === 'done' ? '&#10003;' : '';
  const tagText = item.status === 'progress' ? 'в прогрес' : item.status === 'done' ? 'завършено' : '';

  if(editingKey === key){
    return `<div class="note-wrap">
      <div class="note ${item.status}">
        <div class="dot">${icon}</div>
        <div class="body">
          <textarea class="edit-input" rows="2" data-editkey="${key}">${escapeHtml(item.text)}</textarea>
        </div>
      </div>
    </div>`;
  }

  return `<div class="note-wrap">
    <div class="note ${item.status}">
      <div class="dot" data-action="cycle" data-note="${noteId}" data-sub="${isSub?item.id:''}"></div>
      <div class="body">
        <div class="txt" data-action="edit" data-note="${noteId}" data-sub="${isSub?item.id:''}">${escapeHtml(item.text)}</div>
        <div class="meta">
          ${tagText ? `<span class="tag">${tagText}</span>` : ''}
          <span class="time">${timeLabel(item.createdAt)}</span>
        </div>
      </div>
      <div class="note-actions">
        <button data-action="edit" data-note="${noteId}" data-sub="${isSub?item.id:''}">&#9998;</button>
        <button class="del" data-action="del" data-note="${noteId}" data-sub="${isSub?item.id:''}">&#10005;</button>
      </div>
    </div>
    ${!isSub ? subsBlock(item) : ''}
  </div>`;
}

function subsBlock(note){
  let html = '';
  if(note.subs && note.subs.length){
    html += `<div class="subs">${note.subs.map(s=>itemRow(s, note.id, true)).join('')}</div>`;
  }
  html += `<div class="add-sub-row" style="margin-left:20px;">`;
  if(addingSubFor === note.id){
    html += `<div class="add-sub-input-row">
      <input type="text" class="sub-input" data-note="${note.id}" placeholder="Подбележка..." maxlength="300">
      <button data-action="sub-save" data-note="${note.id}">OK</button>
    </div>`;
  }else{
    html += `<button class="add-sub-link" data-action="sub-open" data-note="${note.id}">+ подбележка</button>`;
  }
  html += `</div>`;
  return html;
}

function render(){
  // Всички бележки (активни и приключени) растат надолу като съобщения в чат:
  // най-старите горе, най-новите долу до полето за писане — възходяща подредба
  // по време. Приключените си остават видимо различими (зачертан текст, зелена
  // точка, таг "завършено"). Всяка бележка носи и часа си (timeLabel), а
  // заглавието на деня се лепи под topbar-а, докато скролваш.
  const q = searchQuery.trim().toLowerCase();
  let all = notes.slice().sort((a,b)=>a.createdAt-b.createdAt);
  if(q){
    all = all.filter(n =>
      n.text.toLowerCase().includes(q) ||
      (n.subs||[]).some(s=>s.text.toLowerCase().includes(q))
    );
  }

  const byDay = {};
  all.forEach(n=>{
    const k = dateStr(n.createdAt);
    (byDay[k] = byDay[k] || []).push(n);
  });
  const dayKeys = Object.keys(byDay).sort();
  if(!q && !dayKeys.includes(todayStr())) dayKeys.push(todayStr());

  let html = '';
  if(q && all.length === 0){
    html = `<div class="empty">Няма намерени бележки за "${escapeHtml(searchQuery.trim())}"</div>`;
  }else{
    dayKeys.forEach(k=>{
      const items = byDay[k] || [];
      html += `<div class="day-block">
        <div class="day-label">${dayLabel(k+'T00:00:00')}${items.length?`<span class="count">${items.length}</span>`:''}</div>
        ${items.length ? items.map(n=>itemRow(n, n.id, false)).join('') : `<div class="empty">Няма бележки</div>`}
      </div>`;
    });
  }
  document.getElementById('activeArea').innerHTML = html;

  updateTopbarHeight();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-action="cycle"]').forEach(el=>{
    el.addEventListener('click', ()=>cycleStatus(el.dataset.note, el.dataset.sub||null));
  });
  document.querySelectorAll('[data-action="del"]').forEach(el=>{
    el.addEventListener('click', ()=>removeItem(el.dataset.note, el.dataset.sub||null));
  });
  document.querySelectorAll('[data-action="edit"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const noteId = el.dataset.note, subId = el.dataset.sub || null;
      editingKey = subId ? noteId+'::'+subId : noteId;
      addingSubFor = null;
      render();
    });
  });
  document.querySelectorAll('.edit-input').forEach(el=>{
    setTimeout(()=>{ el.focus(); el.selectionStart = el.value.length; }, 0);
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        const [noteId, subId] = el.dataset.editkey.split('::');
        commitEdit(noteId, subId||null, el.value);
      }
      if(e.key === 'Escape'){ editingKey = null; render(); }
    });
    el.addEventListener('blur', ()=>{
      if(editingKey === null) return;
      const [noteId, subId] = el.dataset.editkey.split('::');
      commitEdit(noteId, subId||null, el.value);
    });
  });
  document.querySelectorAll('[data-action="sub-open"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      addingSubFor = el.dataset.note;
      editingKey = null;
      render();
      setTimeout(()=>{
        const inp = document.querySelector('.sub-input[data-note="'+el.dataset.note+'"]');
        if(inp) inp.focus();
      },0);
    });
  });
  document.querySelectorAll('[data-action="sub-save"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const inp = document.querySelector('.sub-input[data-note="'+el.dataset.note+'"]');
      if(inp) addSub(el.dataset.note, inp.value);
    });
  });
  document.querySelectorAll('.sub-input').forEach(el=>{
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ addSub(el.dataset.note, el.value); }
    });
  });
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  addNote(document.getElementById('noteInput').value);
  document.getElementById('noteInput').value = '';
  document.getElementById('noteInput').focus();
});
document.getElementById('noteInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    addNote(e.target.value);
    e.target.value = '';
  }
});

const searchBtn = document.getElementById('searchBtn');
const searchRow = document.getElementById('searchRow');
const searchInput = document.getElementById('searchInput');
searchBtn.addEventListener('click', ()=>{
  const open = searchRow.classList.toggle('open');
  searchBtn.classList.toggle('active', open);
  updateTopbarHeight();
  if(open){ searchInput.focus(); }
  else{ searchQuery=''; searchInput.value=''; render(); }
});
searchInput.addEventListener('input', e=>{ searchQuery = e.target.value; render(); });
document.getElementById('searchClear').addEventListener('click', ()=>{
  searchQuery=''; searchInput.value=''; searchInput.focus(); render();
});

// Плаващо копче "най-нови" — появява се, ако потребителят е скролнал далеч
// от дъното на страницата (напр. докато преглежда резултати от търсене).
const jumpBtn = document.getElementById('jumpBtn');
window.addEventListener('scroll', ()=>{
  const fromBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
  jumpBtn.classList.toggle('show', fromBottom > 300);
});
jumpBtn.addEventListener('click', ()=>scrollToBottom(true));

window.addEventListener('resize', updateTopbarHeight);

load();
</script>
</body>
</html>

<!doctype html>
<!--
  Банер за Google Play ("feature graphic", изисква се ТОЧНО 1024×500).
  Рендира се от store/generate.js → store/banner.png.
  Цветовете са същите като на логото/нативния splash (#1E2A37) — виж
  "Икони/splash screen" в CLAUDE.md; ако логото се смени, семплирай
  новия фонов цвят и обнови и тук, и в package.json скрипта "icons".
-->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1024px;height:500px;overflow:hidden;position:relative;
    background:radial-gradient(120% 140% at 18% 30%, #24344a 0%, #1E2A37 45%, #131b25 100%);
    font-family:'DM Sans',sans-serif;
  }
  /* Истинският фон на приложението, съвсем леко, за връзка с апа. */
  .tile{
    position:absolute;inset:0;
    background:url('../bg-dark-v3.jpg') repeat;background-size:420px;
    opacity:.22;
  }
  .wrap{
    position:relative;height:100%;display:flex;align-items:center;
    /* Play реже краищата в някои изгледи — държим съдържанието навътре. */
    padding:0 74px;gap:56px;
  }
  .text{flex:1;min-width:0}
  .name{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:92px;line-height:1;color:#F2F4F7;letter-spacing:.5px;
  }
  .name .i{color:#C6A052}
  .motto{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:34px;color:#C6A052;margin-top:10px;letter-spacing:.4px;
  }
  .beats{
    margin-top:26px;font-size:16px;font-weight:600;letter-spacing:3.6px;
    /* И трите такта с еднакво тегло/цвят — редуването изглеждаше като
       грешка, а не като акцент (те са СТЪПКИ, равнопоставени). */
    text-transform:uppercase;color:#E8EDF4;
  }
  .sub{
    margin-top:20px;font-size:19px;font-weight:300;line-height:1.5;color:#B7C6D9;
    max-width:430px;
  }
  .art{
    width:330px;height:330px;flex:none;position:relative;
    display:grid;place-items:center;
  }
  .art::before{
    content:'';position:absolute;width:330px;height:330px;border-radius:50%;
    background:radial-gradient(circle, rgba(198,160,82,.22) 0%, rgba(198,160,82,0) 68%);
  }
  .art img{width:100%;height:100%;object-fit:contain;position:relative;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
</style>
<div class="tile"></div>
<div class="wrap">
  <div class="text">
    <div class="name"><span class="i">i</span>Forget</div>
    <div class="motto">Think less. Do more.</div>
    <div class="beats">Запиши. Направи. Приключи.</div>
    <div class="sub">Прост списък за всеки ден — напомняния, подзадачи и календар, на едно място.</div>
  </div>
  <div class="art"><img src="../assets/logo.png" alt=""></div>
</div>
